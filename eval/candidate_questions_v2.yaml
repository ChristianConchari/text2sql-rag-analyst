# v2 evaluation questions: harder, built on the failure modes seen in the v1 baseline.
# Levers: (S) column / value semantics, (E) entities named as users write them (aliases, accents, ambiguity),
# (M) multi-step calculations. Table: oc_lineas (one row per order LINE ITEM; order amounts repeat per line).
# Reference SQL is a first draft authored by the assistant: validate the business definitions before trusting it.

- id: v01
  lever: S
  question: "¿Cuántas órdenes de compra provienen de una licitación pública?"
  kind: answerable
  difficulty: medium
  traps: ["la columna es ProcedenciaOC = 'Proveniente de licitación pública'; CodigoLicitacion no vacío da otro número (incluye licitaciones privadas, etc.)"]
  sql: "select count(distinct Codigo) from oc_lineas where ProcedenciaOC = 'Proveniente de licitación pública'"

- id: v02
  lever: S
  question: "¿Cuántas órdenes se emitieron por emergencia, urgencia o imprevisto?"
  kind: answerable
  difficulty: medium
  traps: ["valor largo y exacto de ProcedenciaOC (texto libre con comas)"]
  sql: "select count(distinct Codigo) from oc_lineas where ProcedenciaOC = 'Emergencia, urgencia o imprevisto'"

- id: v03
  lever: S
  question: "¿Cuántas órdenes de compra ágil no fueron tratos directos?"
  kind: answerable
  difficulty: hard
  traps: ["EsTratoDirecto es NULL en las compras ágiles: filtrar = 'No' devuelve 0; hay que usar IS DISTINCT FROM 'Si' o IS NULL"]
  sql: "select count(distinct Codigo) from oc_lineas where EsCompraAgil = 'Si' and EsTratoDirecto is distinct from 'Si'"

- id: v04
  lever: S
  question: "¿Cuántas órdenes están pendientes de que el proveedor las acepte?"
  kind: answerable
  difficulty: hard
  traps: ["Estado = 'Enviada a proveedor'; 'FechaAceptacion is null' da otro número (incluye en proceso y canceladas)"]
  sql: "select count(distinct Codigo) from oc_lineas where Estado = 'Enviada a proveedor'"

- id: v05
  lever: S
  question: "¿Cuál es el monto total de las órdenes emitidas en dólares estadounidenses, en dólares?"
  kind: answerable
  difficulty: hard
  traps: ["MontoTotalOC_PesosChilenos es NULL para USD: hay que usar MontoTotalOC con TipoMonedaOC = 'USD'", "dedup por orden"]
  sql: |
    with o as (select Codigo, any_value(TipoMonedaOC) as moneda, any_value(MontoTotalOC) as monto from oc_lineas group by Codigo)
    select round(sum(monto), 2) from o where moneda = 'USD'

- id: v06
  lever: S
  question: "¿Cuántos proveedores son en realidad organismos públicos que también aparecen como compradores?"
  kind: answerable
  difficulty: hard
  traps: ["no hay un campo que lo indique: hay que cruzar NombreProveedor con OrganismoPublico"]
  sql: "select count(distinct NombreProveedor) from oc_lineas where NombreProveedor in (select distinct OrganismoPublico from oc_lineas)"

- id: v07
  lever: S
  question: "¿Qué porcentaje de las órdenes del sector Salud fueron compras ágiles?"
  kind: answerable
  difficulty: medium
  traps: ["dedup por orden antes de calcular el porcentaje"]
  sql: |
    with o as (select Codigo, any_value(sector) as sector, any_value(EsCompraAgil) as agil from oc_lineas group by Codigo)
    select round(100.0 * count(*) filter (where agil = 'Si') / count(*), 2) from o where sector = 'Salud'

- id: v08
  lever: E
  question: "¿Cuánto vendió Copec en pesos chilenos?"
  kind: answerable
  difficulty: medium
  traps: ["nombre real 'COPEC S.A.'", "dedup por orden y _PesosChilenos"]
  sql: |
    with o as (select Codigo, any_value(NombreProveedor) as prov, any_value(MontoTotalOC_PesosChilenos) as monto from oc_lineas group by Codigo)
    select round(sum(monto)) from o where prov = 'COPEC S.A.'

- id: v09
  lever: E
  question: "¿Cuánto compró la Municipalidad de Temuco en pesos chilenos?"
  kind: answerable
  difficulty: hard
  traps: ["el nombre real es 'I MUNICIPALIDAD DE TEMUCO'; buscar '%temuco%' incluye además dos corporaciones municipales (resultado distinto)"]
  sql: |
    with o as (select Codigo, any_value(OrganismoPublico) as org, any_value(MontoTotalOC_PesosChilenos) as monto from oc_lineas group by Codigo)
    select round(sum(monto)) from o where org = 'I MUNICIPALIDAD DE TEMUCO'

