- id: v14
  lever: E
  question: "¿Cuántas órdenes se emitieron en la región del Biobío?"
  kind: answerable
  difficulty: medium
  traps: ["valor 'Región del Biobío ' con espacio final; escribir 'Bio Bio' no coincide"]
  sql: "select count(distinct Codigo) from oc_lineas where trim(RegionUnidadCompra) = 'Región del Biobío'"

- id: v15
  lever: M
  question: "¿Cuál es el índice de concentración HHI de los proveedores del sector Salud según monto?"
  kind: answerable
  difficulty: hard
  traps: ["HHI = suma de (participación en %)^2 por proveedor", "dedup por orden", "agrupar por proveedor"]
  sql: |
    with o as (select Codigo, any_value(CodigoProveedor) as prov, any_value(sector) as sector, any_value(MontoTotalOC_PesosChilenos) as monto from oc_lineas group by Codigo),
    p as (select prov, sum(monto) as m from o where sector = 'Salud' group by prov)
    select round(sum(power(100.0 * m / (select sum(m) from p), 2)), 2) from p

- id: v16
  lever: M
  question: "¿Cuántos organismos destinaron más del 50% de su monto comprado a un solo proveedor?"
  kind: answerable
  difficulty: hard
  traps: ["dos niveles de agregación (organismo x proveedor, luego por organismo)", "dedup por orden"]
  sql: |
    with o as (select Codigo, any_value(OrganismoPublico) as org, any_value(CodigoProveedor) as prov, any_value(MontoTotalOC_PesosChilenos) as monto from oc_lineas group by Codigo),
    op as (select org, prov, sum(monto) as m from o group by org, prov),
    t as (select org, max(m) / sum(m) as share from op group by org having sum(m) > 0)
    select count(*) from t where share > 0.5

- id: v17
  lever: M
  question: "¿Qué sector tiene el mayor porcentaje de su monto en órdenes de trato directo?"
  kind: answerable
  difficulty: hard
  traps: ["ratio de montos (no de conteos)", "excluir sector NULL", "dedup por orden"]
  sql: |
    with o as (select Codigo, any_value(sector) as sector, any_value(EsTratoDirecto) as td, any_value(MontoTotalOC_PesosChilenos) as monto from oc_lineas group by Codigo)
    select sector, round(100.0 * sum(case when td = 'Si' then monto else 0 end) / sum(monto), 2) as pct
    from o where sector is not null group by sector order by pct desc limit 1

- id: v18
  lever: M
  question: "¿Cuántas órdenes tardaron más de 5 días en ser aceptadas por el proveedor?"
  kind: answerable
  difficulty: medium
  traps: ["diferencia de fechas FechaAceptacion - FechaEnvio", "excluir órdenes sin aceptación", "dedup por orden"]
  sql: |
    with o as (select Codigo, any_value(FechaEnvio) as envio, any_value(FechaAceptacion) as acept from oc_lineas group by Codigo)
    select count(*) from o where acept is not null and date_diff('day', envio, acept) > 5

- id: v19
  lever: M
  question: "¿Qué proveedor tuvo más órdenes con más de 3 ítems?"
  kind: answerable
  difficulty: hard
  traps: ["contar líneas por orden primero, luego órdenes por proveedor"]
  sql: |
    with l as (select Codigo, any_value(NombreProveedor) as prov, count(*) as n from oc_lineas group by Codigo)
    select prov, count(*) as ordenes from l where n > 3 group by prov order by ordenes desc limit 1

- id: v20
  lever: M
  question: "¿Cuáles son las 3 regiones con mayor monto promedio por orden en el sector Salud?"
  kind: answerable
  difficulty: hard
  traps: ["promedio por orden (dedup), no por línea", "trim de la región"]
  sql: |
    with o as (select Codigo, any_value(trim(RegionUnidadCompra)) as region, any_value(sector) as sector, any_value(MontoTotalOC_PesosChilenos) as monto from oc_lineas group by Codigo)
    select region, round(avg(monto)) as promedio from o where sector = 'Salud' group by region order by promedio desc limit 3

- id: v21
  lever: S
  question: "¿Cuántas órdenes superaron los mil millones de pesos, por sector?"
  kind: answerable
  difficulty: medium
  traps: ["usar _PesosChilenos (hay otras monedas)", "dedup por orden", "incluir el grupo de sector NULL"]
  sql: |
    with o as (select Codigo, any_value(sector) as sector, any_value(MontoTotalOC_PesosChilenos) as monto from oc_lineas group by Codigo)
    select sector, count(*) from o where monto > 1000000000 group by sector order by 2 desc, 1

- id: v22
  lever: M
  question: "¿Cuántas órdenes del sector Salud tienen más de un ítem y superan los 10 millones de pesos?"
  kind: answerable
  difficulty: medium
  traps: ["condición sobre conteo de líneas y sobre monto deduplicado"]
  sql: |
    with o as (select Codigo, any_value(sector) as sector, any_value(MontoTotalOC_PesosChilenos) as monto, count(*) as n from oc_lineas group by Codigo)
    select count(*) from o where sector = 'Salud' and n > 1 and monto > 10000000

