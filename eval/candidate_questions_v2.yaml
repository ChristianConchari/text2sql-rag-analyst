- id: v12
  lever: E
  question: "¿Cuánto gastó el sector Salud en medicamentos, en pesos chilenos?"
  kind: answerable
  difficulty: hard
  traps: ["'medicamentos' = RubroN1 'Medicamentos y productos farmacéuticos'", "nivel ítem: totalLineaNeto con monedaItem = 'CLP'"]
  sql: |
    select round(sum(totalLineaNeto)) from oc_lineas
    where sector = 'Salud' and RubroN1 = 'Medicamentos y productos farmacéuticos' and monedaItem = 'CLP'

