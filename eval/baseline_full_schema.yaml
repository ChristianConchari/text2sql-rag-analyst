# Baseline: Claude Sonnet subagents, full 82-column schema in the prompt, no glossary, no data access, no verifier.
# Run 2026-10-25 on candidate_questions.yaml. Raw model outputs, unedited.
q01: "SELECT COUNT(DISTINCT \"Codigo\") FROM oc_lineas WHERE \"FechaEnvio\" >= DATE '2026-01-01' AND \"FechaEnvio\" < DATE '2026-02-01';"
q02: "SELECT COUNT(DISTINCT \"CodigoOrganismoPublico\") FROM oc_lineas;"
q03: "SELECT COUNT(DISTINCT \"Codigo\") FROM oc_lineas WHERE \"EsCompraAgil\" IN ('Si','SI','Sí','1','S','true','TRUE');"
q04: "SELECT COUNT(DISTINCT \"Codigo\") FROM oc_lineas WHERE \"FechaSolicitudCancelacion\" IS NOT NULL OR \"Estado\" ILIKE '%cancelaci%solicitada%';"
q05: "SELECT 100.0 * COUNT(DISTINCT CASE WHEN \"EsTratoDirecto\" IN ('Si','SI','Sí','1','S','true','TRUE') THEN \"Codigo\" END) / COUNT(DISTINCT \"Codigo\") AS porcentaje_trato_directo FROM oc_lineas;"
q06: "SELECT SUM(\"MontoTotalOC_PesosChilenos\") FROM (SELECT \"Codigo\", ANY_VALUE(\"MontoTotalOC_PesosChilenos\") AS \"MontoTotalOC_PesosChilenos\" FROM oc_lineas GROUP BY \"Codigo\");"
q07: "SELECT SUM(m) FROM (SELECT \"Codigo\", ANY_VALUE(\"MontoTotalOC_PesosChilenos\") AS m FROM oc_lineas GROUP BY \"Codigo\" HAVING MAX(\"FechaSolicitudCancelacion\") IS NULL AND MAX(\"FechaAceptacion\") IS NOT NULL AND BOOL_AND(\"Estado\" NOT ILIKE '%cancelaci%solicitada%'));"
q08: "SELECT \"OrganismoPublico\", SUM(\"MontoTotalOC_PesosChilenos\") AS monto_total FROM (SELECT DISTINCT \"Codigo\", \"OrganismoPublico\", \"MontoTotalOC_PesosChilenos\", \"sector\" FROM oc_lineas WHERE \"sector\" = 'Salud') GROUP BY \"OrganismoPublico\" ORDER BY monto_total DESC LIMIT 5;"
q09: "SELECT \"RegionUnidadCompra\", COUNT(DISTINCT \"Codigo\") AS ordenes FROM oc_lineas GROUP BY \"RegionUnidadCompra\" ORDER BY ordenes DESC LIMIT 5;"
q10: "SELECT COUNT(DISTINCT \"CodigoProveedor\") AS proveedores FROM oc_lineas WHERE \"sector\" = 'Salud';"
q11: "SELECT \"CodigoProveedor\", \"NombreProveedor\", SUM(\"MontoTotalOC_PesosChilenos\") AS monto_total FROM (SELECT DISTINCT \"Codigo\", \"CodigoProveedor\", \"NombreProveedor\", \"MontoTotalOC_PesosChilenos\" FROM oc_lineas WHERE \"EsTratoDirecto\" IN ('Si', 'SI', 'Sí', '1', 'true', 'TRUE')) GROUP BY \"CodigoProveedor\", \"NombreProveedor\" ORDER BY monto_total DESC LIMIT 10;"
q12: "WITH ordenes AS (SELECT DISTINCT \"Codigo\", \"CodigoProveedor\", \"MontoTotalOC_PesosChilenos\" AS monto FROM oc_lineas WHERE \"sector\" = 'Salud'), por_prov AS (SELECT \"CodigoProveedor\", SUM(monto) AS monto FROM ordenes GROUP BY \"CodigoProveedor\"), top10 AS (SELECT monto FROM por_prov ORDER BY monto DESC LIMIT 10) SELECT 100.0 * (SELECT SUM(monto) FROM top10) / (SELECT SUM(monto) FROM por_prov) AS porcentaje_top10;"
q13: "SELECT \"RubroN1\", SUM(\"totalLineaNeto\") AS gasto_neto FROM oc_lineas WHERE \"monedaItem\" = 'CLP' GROUP BY \"RubroN1\" ORDER BY gasto_neto DESC LIMIT 1;"
q14: "SELECT \"sector\", AVG(date_diff('day', \"FechaEnvio\", \"FechaAceptacion\")) AS dias_promedio_aceptacion FROM (SELECT DISTINCT \"Codigo\", \"sector\", \"FechaEnvio\", \"FechaAceptacion\" FROM oc_lineas WHERE \"FechaEnvio\" IS NOT NULL AND \"FechaAceptacion\" IS NOT NULL) GROUP BY \"sector\" ORDER BY dias_promedio_aceptacion DESC;"
q15: "SELECT \"Tipo\", median(\"MontoTotalOC_PesosChilenos\") AS monto_mediano_clp FROM (SELECT \"Codigo\", \"Tipo\", MAX(\"MontoTotalOC_PesosChilenos\") AS \"MontoTotalOC_PesosChilenos\" FROM oc_lineas GROUP BY \"Codigo\", \"Tipo\") GROUP BY \"Tipo\" ORDER BY monto_mediano_clp DESC;"
q16: "SELECT COUNT(*) AS ordenes_con_mas_de_un_item FROM (SELECT \"Codigo\" FROM oc_lineas GROUP BY \"Codigo\" HAVING COUNT(*) > 1);"
q17: "CLARIFY: \"Mayor\" es ambiguo (monto total, número de órdenes o líneas) y no se especifica el criterio ni si se agrupa por proveedor o sucursal."
q18: "CLARIFY: \"Realmente pagado\" no existe en la tabla (solo montos de OC, no pagos efectivos) y \"Salud\" podría referirse a sector, rubro u organismo comprador, por lo que se requiere aclarar."
q19: "UNANSWERABLE: No hay un campo de peso normalizado; la unidad de medida y las especificaciones son texto libre, por lo que el precio por kilo de arroz no se puede calcular de forma confiable."
q20: "REFUSE: Se pide una operación destructiva (DROP/DELETE) y solo se permiten consultas de lectura."
