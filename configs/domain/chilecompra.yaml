# Política SQL del dominio ChileCompra. La lee src/policies (no hay nada hardcodeado allí).
allowed_tables: [oc_lineas]
limits:
  default: 100     # se inyecta si la consulta no trae LIMIT
  max: 1000        # un LIMIT mayor se recorta a este valor
# Columnas con datos personales: la consulta se rechaza si las menciona (o usa SELECT *).
blocked_columns:
  - RutSucursal    # puede ser el RUT personal de un proveedor persona natural
  - Sucursal       # a veces es el RUT sin puntos
# Texto libre con correos y teléfonos verificados (glosario, 2026-11-10): solo pueden aparecer dentro de WHERE,
# en un predicado de texto contra literales (ILIKE, LIKE, =, <>, IN, IS NULL, regexp_matches, contains), opcionalmente
# envueltas en lower/upper/trim/strip_accents. Nunca en SELECT, GROUP BY, ORDER BY ni en conversiones que puedan
# fallar (el mensaje de error de DuckDB citaría el valor).
filter_only_columns:
  - Descripcion/Obervaciones
  - EspecificacionComprador
  - EspecificacionProveedor
# Se permiten, pero el verificador emite una advertencia (enmascarar en la respuesta).
restricted_columns:
  - NombreProveedor
# Enmascarado de personas naturales: la columna `column` solo se muestra si la fila trae `flag_column` = FALSE.
# El verificador agrega la marca a la consulta cuando es seguro; el guardrail de salida enmascara.
masking:
  column: NombreProveedor
  flag_column: es_persona_natural
